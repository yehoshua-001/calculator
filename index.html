<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Project: Calculator | The Odin Project</title>
        <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/lcd">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="calculator">
            <div class="header">
                <h1>CALCULATOR</h1>
                <div class="links">
                    &copy;
                    <a id="odinlink" href="https://www.theodinproject.com/about" target="_blank">The Odin Project</a>. All rights reserved. <br>
                    <a id="githublink" href="https://github.com/yehoshua-001/calculator" target="_blank">github.com/yehoshua-001</a>
                </div>
            </div>
            <div class="display">
                <input id="display" type="text" value="" readonly>
            </div>
            <div class="button-container">
                <div class="operators">
                    <button id="operator" data-key="+">+</button>
                    <button id="operator" data-key="-">-</button>
                    <button id="operator" data-key="*">*</button>
                    <button id="operator" data-key="/">/</button>
                </div>
                <div class="partition">
                    <div class="numbers">
                        <button id="number" data-key="7">7</button>
                        <button id="number" data-key="8">8</button>
                        <button id="number" data-key="9">9</button>
                        <button id="number" data-key="4">4</button>
                        <button id="number" data-key="5">5</button>
                        <button id="number" data-key="6">6</button>
                        <button id="number" data-key="1">1</button>
                        <button id="number" data-key="2">2</button>
                        <button id="number" data-key="3">3</button>
                        <button id="number" data-key="0">0</button>
                        <button id="decimal" data-key=".">.</button>
                    </div>
                    <div class="options">
                        <button id="clear" data-key="Backspace">⌫</button>
                        <button id="allClear" data-key="c">C</button>
                        <button id="equal" data-key="Enter">=</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
